image:
  repository: ghcr.io/samuelvlopes/devsecops-showcase/http-server-projeto-korp
  tag: main
  pullPolicy: Always

app:
  replicas: 1
  port: 8080
  otel:
    enabled: false
    endpoint: http://observability-alloy:4318
    serviceName: http-server-projeto-korp

nginx:
  replicas: 1
  # Imagem unprivileged: o entrypoint da imagem oficial do nginx roda como root
  # e faz chown em /var/cache/nginx, o que falha com capabilities dropadas.
  # A variante unprivileged ja vem com as permissoes corretas, roda como 101 e
  # escuta em porta alta, dispensando CAP_NET_BIND_SERVICE.
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31-alpine
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 5s

resources:
  app:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nginx:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
