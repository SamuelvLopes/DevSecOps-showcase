name: Clean-room Image

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "tests/clean-room/**"
      - ".github/workflows/clean-room-image.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "tests/clean-room/**"
      - ".github/workflows/clean-room-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/samuelvlopes/devsecops-showcase/ansible-clean-room-ubuntu

jobs:
  build:
    name: Build and publish Ubuntu clean-room image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=24.04,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Projeto Korp Ansible Clean-room Ubuntu
            org.opencontainers.image.description=Ubuntu 24.04 target for disposable Ansible/DinD validation

      - name: Build clean-room image
        uses: docker/build-push-action@v6
        with:
          context: ./tests/clean-room
          file: ./tests/clean-room/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=clean-room
          cache-to: type=gha,mode=max,scope=clean-room
