name: Terraform

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Terraform examples
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: make terraform-fmt

      - name: Validate AWS example
        run: make terraform-validate-aws

      - name: Validate Azure example
        run: make terraform-validate-azure
