---
- name: Ensure project directory exists
  ansible.builtin.file:
    path: "{{ korp_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Compose file
  ansible.builtin.copy:
    src: "{{ korp_repo_src }}/compose.yaml"
    dest: "{{ korp_project_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Copy application source
  ansible.builtin.copy:
    src: "{{ korp_repo_src }}/app"
    dest: "{{ korp_project_dir }}/"
    owner: root
    group: root
    mode: preserve

- name: Copy NGINX configuration
  ansible.builtin.copy:
    src: "{{ korp_repo_src }}/nginx"
    dest: "{{ korp_project_dir }}/"
    owner: root
    group: root
    mode: preserve

- name: Copy Prometheus configuration
  ansible.builtin.copy:
    src: "{{ korp_repo_src }}/prometheus"
    dest: "{{ korp_project_dir }}/"
    owner: root
    group: root
    mode: preserve

- name: Copy Grafana provisioning
  ansible.builtin.copy:
    src: "{{ korp_repo_src }}/grafana"
    dest: "{{ korp_project_dir }}/"
    owner: root
    group: root
    mode: preserve

- name: Check whether the Docker network already exists
  community.docker.docker_network_info:
    name: "{{ korp_network_name }}"
  register: korp_network_info

- name: Create Docker bridge network
  community.docker.docker_network:
    name: "{{ korp_network_name }}"
    driver: bridge
    labels: "{{ korp_network_labels }}"
    state: present
  when: not korp_network_info.exists

- name: Validate Docker network driver
  community.docker.docker_network_info:
    name: "{{ korp_network_name }}"
  register: korp_network_state
  failed_when: >-
    not korp_network_state.exists or
    korp_network_state.network.Driver != "bridge"

- name: Converge Compose stack
  ansible.builtin.command:
    cmd: docker compose -f "{{ korp_compose_file }}" up --build -d
  register: korp_compose_up
  changed_when: false
