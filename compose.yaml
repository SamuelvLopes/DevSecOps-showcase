services:
  app:
    build:
      context: ./app
    image: http-server-projeto-korp:local
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    networks:
      - projeto-korp

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - projeto-korp

networks:
  projeto-korp:
    name: projeto-korp
    driver: bridge
